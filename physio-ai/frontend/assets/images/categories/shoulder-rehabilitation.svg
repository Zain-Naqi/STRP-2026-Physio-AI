<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="bgGradShoulder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F3EE" />
      <stop offset="100%" stop-color="#EBE2D7" />
    </linearGradient>
    <linearGradient id="accentShoulder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97757" />
      <stop offset="100%" stop-color="#B85535" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="24" fill="url(#bgGradShoulder)"/>
  <circle cx="180" cy="160" r="100" fill="#FFFFFF" fill-opacity="0.65"/>
  <!-- Torso & Shoulder joint curve -->
  <path d="M140 240 C140 180 155 140 185 130 C205 123 235 135 260 160" stroke="#1C3A32" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Arm raised arc (Abduction / Flexion) -->
  <path d="M185 130 C195 95 220 70 260 65" stroke="#1C3A32" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="185" cy="130" r="9" fill="url(#accentShoulder)"/>
  <!-- Smooth mobility arc -->
  <path d="M260 65 A 90 90 0 0 1 270 160" stroke="#4A7C6D" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="round"/>
  <circle cx="260" cy="65" r="5" fill="#1C3A32"/>
</svg>
